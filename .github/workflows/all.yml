name: Compile, Test, and Deploy

on:
  pull_request: {}
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run containing the java-all-platforms artifact
        required: true
        type: string
        default: '38957851781'
      version:
        description: Expected Voyager version
        required: true
        type: string
        default: '2.2.0'
      publish:
        description: Publish to Central after verifying signatures (otherwise only test signing)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('maven-{0}', inputs.version) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  lint-java:
    if: github.event_name != 'workflow_dispatch'
    runs-on: 'ubuntu-latest'
    continue-on-error: true
    name: Lint Java
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'corretto'
      - name: Check Formatting
        run: mvn --batch-mode com.spotify.fmt:fmt-maven-plugin:check

  lint-cpp:
    if: github.event_name != 'workflow_dispatch'
    runs-on: 'ubuntu-latest'
    continue-on-error: true
    name: Lint C++
    steps:
      - uses: actions/checkout@v7
      - name: Check C++ Formatting
        uses: jidicula/clang-format-action@v4.13.0
        with:
          clang-format-version: 16

  run-cpp-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    defaults:
      run:
        working-directory: cpp
    strategy:
      matrix:
        os:
          - 'ubuntu-latest'
          - windows-latest
          - macos-latest
    name: Test C++ on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake --version
      - name: Install CMake (MacOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake
      - name: Install CMake (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get install -y cmake
      - name: Run tests
        run: make test

  run-java-tests:
    if: github.event_name != 'workflow_dispatch'
    continue-on-error: true
    name: Test with Java ${{ matrix.java-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: java
    strategy:
      matrix:
        os: ['ubuntu-latest', windows-latest, macos-latest]
        java-version: ['11', '17']
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'corretto'
          gpg-private-key: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/.github/scripts/setup-msvc.ps1"'
      - name: Compile
        run: make
      - name: Run Tests
        run: mvn --batch-mode test

  run-java-tests-with-address-sanitizer:
    if: false  # Disabled due to ASan log spam in output
    continue-on-error: true
    name: Test with Java ${{ matrix.java-version }} + Address Sanitizer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    strategy:
      matrix:
        java-version: ['11', '17']
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'corretto'
          gpg-private-key: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Compile
        env:
          USE_ASAN: "1"
        run: make target/classes/linux-x64/libvoyager.so
      - name: Run Tests
        run: |
          ASAN_OPTIONS=detect_leaks=0
          LD_PRELOAD=$(clang -print-file-name=libclang_rt.asan-x86_64.so) \
          mvn --batch-mode test


  run-python-tests:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    defaults:
      run:
        working-directory: python
    strategy:
      matrix:
        python-version:
          - '3.9'
          - '3.13'
        os: ['ubuntu-latest', windows-latest, macos-latest]
    name: Test with Python ${{ matrix.python-version }} on ${{ matrix.os }}
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Copy README into place
        run: cp ../README.md ./
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config 
      - name: Install test dependencies
        env:
          # on macOS and with Python 3.10: building NumPy from source fails without these options:
          NPY_BLAS_ORDER: ""
          NPY_LAPACK_ORDER: ""
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          pip install setuptools
          pip install -r dev-requirements.txt
      - name: Build voyager locally
        run: python -m pip install .
      - name: Run tox tests
        run: tox

  run-python-tests-with-address-sanitizer:
    if: github.event_name != 'workflow_dispatch'
    defaults:
      run:
        working-directory: python
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version:
          - '3.9'
        os: ['ubuntu-latest']
    name: Test with Python ${{ matrix.python-version }} + Address Sanitizer
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Copy README into place
        run: cp ../README.md ./
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config 
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          pip install setuptools
          pip install -r dev-requirements.txt
      - name: Build voyager locally
        env:
          DEBUG: "0"
          USE_ASAN: "1"
          CC: clang
          CXX: clang++
        run: python -m pip install .
      - name: Run tox tests with ASan loaded
        # pytest can exit before all Python objects have been destroyed,
        # so we tell ASan to ignore leaks.
        run: |
          ASAN_OPTIONS=detect_leaks=0 \
          LD_PRELOAD=$(clang -print-file-name=libclang_rt.asan-x86_64.so) \
          tox

  run-python-benchmarks:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request' 
    name: Run Python benchmarks
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 
          submodules: recursive
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config 
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel
          pip install -r python/dev-requirements.txt
      - name: Run benchmarks
        run: |
             asv machine --yes
             asv continuous --sort name --no-only-changed refs/remotes/origin/main ${{ github.sha }} | tee >(sed '1,/All benchmarks:/d' > $GITHUB_STEP_SUMMARY)

  run-java-benchmarks:
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        family: [Index, StringIndex]
    name: Run Java benchmarks (${{ matrix.family }})
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_SHA: ${{ github.sha }}
      BENCHMARK_FAMILY: ${{ matrix.family }}
      BENCHMARK_FILTER: '^com[.]spotify[.]voyager[.]jni[.]${{ matrix.family }}(Creation|Query)Benchmark[.].*$'
      # JMH needs at least three measurements to compute the comparison's error margins.
      JMH_ARGS: "-f 1 -wi 2 -i 3 -w 1s -r 1s -foe true -jvmArgs '-Xms2g -Xmx2g'"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Check base benchmarks
        id: baseline
        run: |
          if git ls-tree -r --name-only "$BASE_SHA" java/src/test/java | grep -Eq "/${BENCHMARK_FAMILY}(Creation|Query)Benchmark[.]java$"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Measure both revisions on the same runner, with identical JMH settings.
      - name: Checkout base branch
        if: steps.baseline.outputs.available == 'true'
        run: git checkout "$BASE_SHA"
      - name: Build benchmarks (base)
        if: steps.baseline.outputs.available == 'true'
        working-directory: java
        # Compile Java once, then build only the native library used by this runner.
        run: |
          make clean
          mvn --batch-mode test-compile -Dexec.skip=true
          make target/classes/linux-x64/libvoyager.so
      - name: Run benchmarks (base)
        if: steps.baseline.outputs.available == 'true'
        working-directory: java
        run: >-
          mvn --batch-mode exec:exec -Dexec.executable=java -Dexec.classpathScope=test
          -Dexec.args="-cp %classpath org.openjdk.jmh.Main $BENCHMARK_FILTER $JMH_ARGS -rf json -rff $RUNNER_TEMP/base-results.json"

      - name: Checkout PR branch
        run: git checkout "$PR_SHA"
      - name: Build benchmarks (PR)
        working-directory: java
        run: |
          make clean
          mvn --batch-mode test-compile -Dexec.skip=true
          make target/classes/linux-x64/libvoyager.so
      - name: Run benchmarks (PR)
        working-directory: java
        run: >-
          mvn --batch-mode exec:exec -Dexec.executable=java -Dexec.classpathScope=test
          -Dexec.args="-cp %classpath org.openjdk.jmh.Main $BENCHMARK_FILTER $JMH_ARGS -rf json -rff $RUNNER_TEMP/pr-results.json"

      # Compare and report
      - name: Compare benchmarks
        run: >-
          python3 java/scripts/compare_benchmarks.py
          "$RUNNER_TEMP/base-results.json" "$RUNNER_TEMP/pr-results.json" >> "$GITHUB_STEP_SUMMARY"

  build-python-sdist:
    needs: [run-python-tests, run-python-tests-with-address-sanitizer]
    continue-on-error: false
    runs-on: 'ubuntu-latest'
    if: github.event_name != 'workflow_dispatch'
    name: Build Python source distribution
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Copy README into place
        run: cp README.md python/
      - name: Copy C++ code into place
        run: rm -rfv python/src/cpp && cp -r cpp python/src
        if: runner.os == 'Linux'
      - name: Install build module
        run: python -m pip install build
      - name: Build source distribution
        working-directory: python
        run: python -m build --sdist --outdir ../dist
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: python-sdist
          path: ./dist/*.tar.gz

  build-python-wheels:
    needs: [run-python-tests, run-python-tests-with-address-sanitizer]
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    if: github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        include:
        - { os: macos-latest, build: cp39-macosx_x86_64 }
        - { os: macos-latest, build: cp310-macosx_x86_64 }
        - { os: macos-latest, build: cp311-macosx_x86_64 }
        # cp312 builds ABI3 wheels that also support Python 3.13+. Building cp313
        # separately produces duplicate filenames that race during artifact download.
        - { os: macos-latest, build: cp312-macosx_x86_64 }
        - { os: macos-latest, build: cp39-macosx_universal2 }
        - { os: macos-latest, build: cp310-macosx_universal2 }
        - { os: macos-latest, build: cp311-macosx_universal2 }
        - { os: macos-latest, build: cp312-macosx_universal2 }
        - { os: macos-latest, build: cp39-macosx_arm64 }
        - { os: macos-latest, build: cp310-macosx_arm64 }
        - { os: macos-latest, build: cp311-macosx_arm64 }
        - { os: macos-latest, build: cp312-macosx_arm64 }
        - { os: windows-latest, build: cp39-win_amd64 }
        - { os: windows-latest, build: cp310-win_amd64 }
        - { os: windows-latest, build: cp311-win_amd64 }
        - { os: windows-latest, build: cp312-win_amd64 }
        - { os: 'ubuntu-latest', build: cp39-manylinux_x86_64 }
        - { os: 'ubuntu-latest', build: cp39-manylinux_aarch64 }
        - { os: 'ubuntu-latest', build: cp310-manylinux_x86_64 }
        - { os: 'ubuntu-latest', build: cp310-manylinux_aarch64 }
        - { os: 'ubuntu-latest', build: cp311-manylinux_x86_64 }
        - { os: 'ubuntu-latest', build: cp311-manylinux_aarch64 }
        - { os: 'ubuntu-latest', build: cp312-manylinux_x86_64 }
        - { os: 'ubuntu-latest', build: cp312-manylinux_aarch64 }
    name: Build wheel for ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # Used to host cibuildwheel, so version doesn't really matter
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install cibuildwheel
        run: python -m pip install 'cibuildwheel>=2.11.0'
      - name: Copy README into place
        run: cp README.md python/
      - name: Set up QEMU for aarch64 on Linux
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all
      - name: Copy C++ code into place
        run: rm -rfv python/src/cpp && cp -r cpp python/src
        if: runner.os == 'Linux'
      - name: Show directory structure for debugging
        run: ls -lR .
        if: runner.os == 'Linux'
      - name: Build wheels
        working-directory: python
        run: python -m cibuildwheel --output-dir ../wheelhouse
        env:
          CIBW_TEST_REQUIRES: -r dev-requirements.txt
          CIBW_TEST_COMMAND: "pytest {project}/tests -x"
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ARCHS: auto64 # Only support building 64-bit wheels. It's 2022!
          CIBW_ARCHS_LINUX: auto64 aarch64 # Useful for building linux images with Apple Silicon
          CIBW_ARCHS_MACOS: x86_64 universal2 arm64 # Support Apple Silicon
          CIBW_ARCHS_WINDOWS: AMD64
          # Prefer dependency wheels and require a NumPy wheel for the older manylinux toolchain.
          CIBW_ENVIRONMENT: NPY_BLAS_ORDER="" NPY_LAPACK_ORDER="" PIP_PREFER_BINARY="1" PIP_ONLY_BINARY="numpy"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: pip install auditwheel-symbols && (auditwheel repair -w {dest_dir} {wheel} || auditwheel-symbols --manylinux 2010 {wheel})
          CIBW_TEST_SKIP: "*aarch64"
          MACOSX_DEPLOYMENT_TARGET: "10.14"
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: python-wheels-${{ matrix.build }}
          path: ./wheelhouse/*.whl

  build-java-jars:
    if: github.event_name != 'workflow_dispatch'
    continue-on-error: false
    name: Build JAR with on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: java
    strategy:
      matrix:
        os: ['ubuntu-latest', windows-latest, macos-latest]
        java-version: ['11']
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'corretto'
          gpg-private-key: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Set up QEMU for aarch64 on Linux
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/.github/scripts/setup-msvc.ps1"'
      - name: Compile
        run: make
      - name: Package
        run: mvn --batch-mode package
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SONATYPE_PASSPHRASE }}
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: java-${{ matrix.os }}
          path: java/target/voyager-*.jar

  combine-java-jars:
    if: github.event_name != 'workflow_dispatch'
    name: Combine JARs
    runs-on: ubuntu-latest
    needs: build-java-jars
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Unpack and Repack JARs
        shell: bash
        working-directory: artifacts
        run: |
          rm -fv java-*/*-sources.jar
          rm -fv java-*/*-javadoc.jar
          for artifact in java-*; do unzip -o $artifact/*.jar -d combined-jar; done
          # Quick test that the JARs were built for the correct architectures
          echo "Checking linux-x64/libvoyager.so for x86 architecture..."
          file combined-jar/linux-x64/libvoyager.so | grep x86
          echo "Checking mac-x64/libvoyager.dylib for x86 architecture..."
          file combined-jar/mac-x64/libvoyager.dylib | grep x86
          echo "Checking linux-aarch64/libvoyager.so for aarch64 architecture..."
          file combined-jar/linux-aarch64/libvoyager.so | grep aarch64
          echo "Checking mac-aarch64/libvoyager.dylib for arm64 architecture..."
          file combined-jar/mac-aarch64/libvoyager.dylib | grep arm64

          echo "Checking the Linux JARs to ensure a sufficiently old required GLIBC and GLIBCXX version in each..."

          echo "Checking linux-aarch64/libvoyager.so (should require at most GLIBC 2.27...)"
          objdump -T combined-jar/linux-aarch64/libvoyager.so | grep GLIBC | grep -v GLIBCXX | sed 's/.*GLIBC_\([.0-9]*\).*/\1/g' | cat - <(echo 2\.27) | sort -Vu | tail -n 1 | grep 2\.27 || (echo "Expected linux-aarch64 binary to require at most glibc 2.27. Ensure the dockcross container has not been updated." && false)
          echo "Checking linux-aarch64/libvoyager.so (should require at most GLIBCXX 3.4.22...)"
          objdump -T combined-jar/linux-aarch64/libvoyager.so | grep GLIBCXX | sed 's/.*GLIBCXX_\([.0-9]*\).*/\1/g' | cat - <(echo 3\.4\.22) | sort -Vu | tail -n 1 | grep 3\.4\.22 || (echo "Expected linux-aarch64 binary to require at most glibc++ 3.4.22. Ensure the dockcross container has not been updated." && false)
          echo "Checking linux-x64/libvoyager.so (should require at most GLIBC 2.27...)"
          objdump -T combined-jar/linux-x64/libvoyager.so | grep GLIBC | grep -v GLIBCXX | sed 's/.*GLIBC_\([.0-9]*\).*/\1/g' | cat - <(echo 2\.27) | sort -Vu | tail -n 1 | grep 2\.27 || (echo "Expected linux-x64 binary to require at most glibc 2.28. Ensure the dockcross container has not been updated." && false)
          echo "Checking linux-x64/libvoyager.so (should require at most GLIBCXX 3.4.22...)"
          objdump -T combined-jar/linux-x64/libvoyager.so | grep GLIBCXX | sed 's/.*GLIBCXX_\([.0-9]*\).*/\1/g' | cat - <(echo 3\.4\.22) | sort -Vu | tail -n 1 | grep 3\.4\.22  || (echo "Expected linux-x64 binary to require at most glibc++ 3.4.22. Ensure the dockcross container has not been updated." && false)

          zip -r $(ls java-* | grep jar | tail -n 1) combined-jar/*
      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: java-all-platforms
          path: artifacts/*.jar

  upload-pypi:
    defaults:
      run:
        working-directory: python
    needs: [build-python-wheels, build-python-sdist, run-python-tests-with-address-sanitizer, run-python-tests]
    runs-on: 'ubuntu-latest'
    name: "Upload wheels and sdist to PyPI"
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: python-sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_DEPLOY_TOKEN }}

  upload-maven:
    name: Upload to Maven Central
    runs-on: ubuntu-latest
    needs: combine-java-jars
    if: github.event_name == 'release' && github.event.action == 'published'
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: java-all-platforms
          path: combined-jar
      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: 11
          distribution: 'corretto'
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_USER_TOKEN
      - name: Deploy
        # Repackage with all downloaded native libraries; skip rebuilding them on this runner.
        run: |
          # Copy the native artifacts built for each platform into the appropriate place:
          unzip ../combined-jar/*.jar -d ../
          mkdir -p target/classes/
          cp -r ../combined-jar/linux* target/classes/
          cp -r ../combined-jar/mac* target/classes/
          cp -r ../combined-jar/win* target/classes/
          mvn --batch-mode deploy -Pcentral-publish -Dmaven.test.skip=true -Dexec.skip=true -Dgpg.signer=bc
        env:
          # Central Portal user-token username and password (not legacy OSSRH credentials).
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_GPG_KEY: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SONATYPE_PASSPHRASE }}
          MAVEN_USER_TOKEN: ${{ secrets.SONATYPE_USER_TOKEN }}

  recover-maven:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
    name: Recover Maven ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve original build
        id: source
        uses: actions/github-script@v8
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |
            const runId = process.env.SOURCE_RUN_ID;
            if (!/^\d+$/.test(runId)) throw new Error('Source run ID must be numeric');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: runId,
            });
            if (run.path !== '.github/workflows/all.yml' ||
                !(run.event === 'release' || (run.event === 'push' && run.head_branch === 'main'))) {
              throw new Error('Source must be a release or main build from all.yml');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: runId, per_page: 100,
            });
            if (!jobs.some(job => job.name === 'Combine JARs' && job.conclusion === 'success')) {
              throw new Error('Source run must have a successful Combine JARs job');
            }
            core.setOutput('sha', run.head_sha);
            await core.summary.addRaw(`Source run: ${run.html_url}\n\nCommit: ${run.head_sha}\n`).write();

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: corretto
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_USER_TOKEN

      - uses: actions/download-artifact@v8
        with:
          name: java-all-platforms
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: combined-jar

      - name: Validate version and restore native libraries
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile

          version = os.environ['EXPECTED_VERSION']
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          pom = ET.parse('source/java/pom.xml')
          assert pom.findtext('m:version', namespaces=ns) == version, 'Source version mismatch'
          jars = list(Path('combined-jar').glob('*.jar'))
          assert len(jars) == 1 and jars[0].name == f'voyager-{version}.jar', 'Artifact version mismatch'
          native_libraries = [
              'linux-x64/libvoyager.so',
              'linux-aarch64/libvoyager.so',
              'mac-x64/libvoyager.dylib',
              'mac-aarch64/libvoyager.dylib',
              'win-x64/voyager.dll',
          ]
          with ZipFile(jars[0]) as jar:
              assert jar.testzip() is None, 'Corrupt combined JAR'
              embedded = ET.fromstring(jar.read('combined-jar/META-INF/maven/com.spotify/voyager/pom.xml'))
              assert embedded.findtext('m:version', namespaces=ns) == version, 'Embedded version mismatch'
              for name in native_libraries:
                  target = Path('source/java/target/classes') / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(jar.read(f'combined-jar/{name}'))
          print(f'Restored {len(native_libraries)} native libraries for Voyager {version}')
          PY

      - name: Package and sign
        working-directory: source/java
        run: >-
          mvn --batch-mode verify -Pcentral-publish
          -Dmaven.test.skip=true -Dexec.skip=true -Dgpg.signer=bc
        env:
          MAVEN_GPG_KEY: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SONATYPE_PASSPHRASE }}

      - name: Verify detached signatures
        working-directory: source/java
        env:
          MAVEN_GPG_KEY: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}
        run: |
          signing_home=$(mktemp -d)
          trap 'gpgconf --homedir "$signing_home" --kill all; rm -rf "$signing_home"' EXIT
          printf '%s' "$MAVEN_GPG_KEY" | gpg --homedir "$signing_home" --batch --quiet --import
          shopt -s nullglob
          signatures=(target/*.asc)
          test "${#signatures[@]}" -eq 4
          for signature in "${signatures[@]}"; do
            gpg --homedir "$signing_home" --batch --verify "$signature" "${signature%.asc}"
          done

      - name: Publish verified artifacts to Central
        if: inputs.publish
        working-directory: source/java
        # Keep packaging and deployment in one Maven session so sources, Javadoc,
        # and signatures remain attached. Native compilation is disabled.
        run: >-
          mvn --batch-mode deploy -Pcentral-publish
          -Dmaven.test.skip=true -Dexec.skip=true -Dgpg.signer=bc
        env:
          MAVEN_GPG_KEY: ${{ secrets.SONATYPE_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SONATYPE_PASSPHRASE }}
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_USER_TOKEN: ${{ secrets.SONATYPE_USER_TOKEN }}

      - name: Summarize result
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          echo "Voyager $VERSION: all four Maven artifact signatures verified." >> "$GITHUB_STEP_SUMMARY"
          echo "Publish requested: $PUBLISH. PyPI was not invoked." >> "$GITHUB_STEP_SUMMARY"
